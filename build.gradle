# MANDO HVAC PRO

موسوعة ماندو الاحترافية للتبريد والتكييف.

تطبيق تعليمي باللغة العربية لتعلم:
- أساسيات التبريد والتكييف.
- دورة التبريد ومكوناتها.
- الضواغط والمكثفات والمبخرات.
- الكهرباء والتحكم.
- صيانة أجهزة التكييف وتشخيص الأعطال.
- أنظمة التكييف المركزي وVRF وChillers.
- اختبارات تعليمية للفنيين والمهندسين.

المطور: MANDO
